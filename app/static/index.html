    <div class="status-chips">
      <p id="arduino-status" class="chip" role="status">Arduino: not connected</p>
      <p id="camera-permission" class="chip"></p>
      <button type="button" id="contrast-toggle" class="chip chip-button" aria-pressed="false">High contrast</button>
    </div>
  </header>

  <!-- Text screen: for sighted helpers (Escape from the camera) -->
  <main id="input-screen" hidden>
    <form id="text-form" class="glass panel">
      <h1>What should we learn?</h1>
      <label for="text-input">Type a word or a few letters</label>
      <textarea id="text-input" rows="2" autocomplete="off" spellcheck="false">abc</textarea>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="start-buttons">
        <button type="submit" id="learn-button" class="glass-button primary" data-mode="learn" aria-label="Learn: type each letter in braille">Learn</button>
        <button type="submit" id="read-button" class="glass-button" data-mode="read" aria-label="Read: show each character in braille">Read</button>
        <button type="submit" id="type-button" class="glass-button" data-mode="type" aria-label="Type: write freely with the remote">Type</button>
        <button type="submit" id="snap-button" class="glass-button" data-mode="snap" aria-label="Camera: learn the name of something you hold up">Camera</button>
      </div>
    </form>
  </main>

  <!-- Home: hold up an object (automatic), or press Enter and say what to learn -->
  <main id="camera-screen" hidden>
    <div class="camera-frame glass">
      <video id="camera" class="camera" autoplay playsinline muted aria-label="Camera view"></video>
    </div>
    <p id="camera-status" class="camera-status" role="status"></p>
    <div class="controls">
      <button type="button" id="talk-button" class="glass-button primary" aria-label="Talk: say what you want to learn (Enter)">Talk <kbd>Enter</kbd></button>
      <button type="button" id="shutter-button" class="glass-button" aria-label="Look now: take the photo">Look now</button>
      <button type="button" id="camera-back-button" class="glass-button" aria-label="Type text instead (Escape)">Type text <kbd>Esc</kbd></button>
    </div>
  </main>

  <!-- Lesson: one character at a time (Learn, Read and Type modes).
       Elements with data-show only appear in the listed modes. -->
  <main id="reader-screen" hidden>
    <div class="stage">
      <button type="button" id="prev-button" class="side-button glass-button" data-show="learn read" aria-label="Previous (Left arrow)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>

      <div class="center">
        <div id="char" class="char" role="img" aria-label=""></div>

        <div class="grids glass">
          <figure class="grid-block" data-show="learn read">
            <div id="cell" class="cell" role="img" aria-label="">
              <!-- Grid order is row by row: 1 4 / 2 5 / 3 6 -->
              <span class="dot" data-dot="1"></span><span class="dot" data-dot="4"></span>
              <span class="dot" data-dot="2"></span><span class="dot" data-dot="5"></span>
              <span class="dot" data-dot="3"></span><span class="dot" data-dot="6"></span>
            </div>
            <figcaption data-show="learn">Target</figcaption>
          </figure>

          <figure class="grid-block" data-show="learn type">
            <div id="input-cell" class="cell" role="group" aria-label="Your input">
              <button type="button" class="dot dot-button" data-dot="1" aria-pressed="false" aria-label="1, top left (key 1 or F)"></button>
              <button type="button" class="dot dot-button" data-dot="4" aria-pressed="false" aria-label="4, top right (key 4 or J)"></button>
              <button type="button" class="dot dot-button" data-dot="2" aria-pressed="false" aria-label="2, middle left (key 2 or D)"></button>
              <button type="button" class="dot dot-button" data-dot="5" aria-pressed="false" aria-label="5, middle right (key 5 or K)"></button>
              <button type="button" class="dot dot-button" data-dot="3" aria-pressed="false" aria-label="3, bottom left (key 3 or S)"></button>
              <button type="button" class="dot dot-button" data-dot="6" aria-pressed="false" aria-label="6, bottom right (key 6 or L)"></button>
            </div>
            <figcaption>You</figcaption>
          </figure>
          <div class="badges" data-show="type">
            <span id="capital-badge" class="badge">Capital</span>
            <span id="number-badge" class="badge">Number</span>
          </div>
        </div>

        <p id="position" class="position" data-show="learn read"></p>
        <p id="feedback" class="feedback" data-show="learn type"></p>
        <p id="typed-text" class="typed-text glass" data-show="type" aria-label="Typed text"></p>
      </div>

      <button type="button" id="next-button" class="side-button glass-button" data-show="learn read" aria-label="Next (Right arrow)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="controls">
      <button type="button" id="check-button" class="glass-button primary" data-show="learn" aria-label="Check my answer (Enter)">Check <kbd>Enter</kbd></button>
      <button type="button" id="enter-button" class="glass-button primary" data-show="type" aria-label="Type this cell (Enter)">Enter</button>
      <button type="button" id="backspace-button" class="glass-button" data-show="type" aria-label="Delete last character (Backspace)">Delete</button>
      <button type="button" id="clear-button" class="glass-button" data-show="type" aria-label="Clear all typed text">Clear</button>
      <button type="button" id="repeat-button" class="glass-button" aria-label="Repeat (R)">Repeat <kbd>R</kbd></button>
      <button type="button" id="back-button" class="glass-button" aria-label="Done (Escape)">Done <kbd>Esc</kbd></button>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
