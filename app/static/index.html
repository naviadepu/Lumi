<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumi</title>
  <!-- The logo: braille "L" (dots 1-2-3) for Lumi -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B3320'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='11' cy='8' r='3.2'/%3E%3Ccircle cx='11' cy='16' r='3.2'/%3E%3Ccircle cx='11' cy='24' r='3.2'/%3E%3C/g%3E%3Cg fill='%23fff' opacity='.3'%3E%3Ccircle cx='21' cy='8' r='3.2'/%3E%3Ccircle cx='21' cy='16' r='3.2'/%3E%3Ccircle cx='21' cy='24' r='3.2'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Moving background: the dotted green gradient, slowly drifting -->
  <div class="backdrop" aria-hidden="true">
    <div class="flow"></div>
  </div>

  <header class="topbar">
    <div class="logo" role="img" aria-label="Lumi">

9.4" cy="86.4" r="2.4"/><circle cx="44.4" cy="86.4" r="2.4"/><circle cx="51.4" cy="86.4" r="2.4"/><circle cx="93.4" cy="86.4" r="2.4"/><circle cx="100.4" cy="86.4" r="2.4"/><circle cx="107.4" cy="86.4" r="2.4"/><circle cx="135.4" cy="86.4" r="2.4"/><circle cx="142.4" cy="86.4" r="2.4"/><circle cx="184.4" cy="86.4" r="2.4"/><circle cx="191.4" cy="86.4" r="2.4"/><circle cx="233.4" cy="86.4" r="2.4"/><circle cx="240.4" cy="86.4" r="2.4"/><circle cx="268.4" cy="86.4" r="2.4"/><circle cx="275.4" cy="86.4" r="2.4"/><circle cx="2.4" cy="93.4" r="2.4"/><circle cx="9.4" cy="93.4" r="2.4"/><circle cx="44.4" cy="93.4" r="2.4"/><circle cx="51.4" cy="93.4" r="2.4"/><circle cx="58.4" cy="93.4" r="2.4"/><circle cx="86.4" cy="93.4" r="2.4"/><circle cx="93.4" cy="93.4" r="2.4"/><circle cx="100.4" cy="93.4" r="2.4"/><circle cx="107.4" cy="93.4" r="2.4"/><circle cx="135.4" cy="93.4" r="2.4"/><circle cx="142.4" cy="93.4" r="2.4"/><circle cx="184.4" cy="93.4" r="2.4"/><circle cx="191.4" cy="93.4" r="2.4"/><circle cx="233.4" cy="93.4" r="2.4"/><circle cx="240.4" cy="93.4" r="2.4"/><circle cx="268.4" cy="93.4" r="2.4"/><circle cx="275.4" cy="93.4" r="2.4"/><circle cx="2.4" cy="100.4" r="2.4"/><circle cx="9.4" cy="100.4" r="2.4"/><circle cx="44.4" cy="100.4" r="2.4"/><circle cx="51.4" cy="100.4" r="2.4"/><circle cx="58.4" cy="100.4" r="2.4"/><circle cx="65.4" cy="100.4" r="2.4"/><circle cx="72.4" cy="100.4" r="2.4"/><circle cx="79.4" cy="100.4" r="2.4"/><circle cx="86.4" cy="100.4" r="2.4"/><circle cx="93.4" cy="100.4" r="2.4"/><circle cx="100.4" cy="100.4" r="2.4"/><circle cx="107.4" cy="100.4" r="2.4"/><circle cx="135.4" cy="100.4" r="2.4"/><circle cx="142.4" cy="100.4" r="2.4"/><circle cx="184.4" cy="100.4" r="2.4"/><circle cx="191.4" cy="100.4" r="2.4"/><circle cx="233.4" cy="100.4" r="2.4"/><circle cx="240.4" cy="100.4" r="2.4"/><circle cx="268.4" cy="100.4" r="2.4"/><circle cx="275.4" cy="100.4" r="2.4"/><circle cx="2.4" cy="107.4" r="2.4"/><circle cx="9.4" cy="107.4" r="2.4"/><circle cx="51.4" cy="107.4" r="2.4"/><circle cx="58.4" cy="107.4" r="2.4"/><circle cx="65.4" cy="107.4" r="2.4"/><circle cx="72.4" cy="107.4" r="2.4"/><circle cx="79.4" cy="107.4" r="2.4"/><circle cx="86.4" cy="107.4" r="2.4"/><circle cx="100.4" cy="107.4" r="2.4"/><circle cx="107.4" cy="107.4" r="2.4"/><circle cx="135.4" cy="107.4" r="2.4"/><circle cx="142.4" cy="107.4" r="2.4"/><circle cx="184.4" cy="107.4" r="2.4"/><circle cx="191.4" cy="107.4" r="2.4"/><circle cx="233.4" cy="107.4" r="2.4"/><circle cx="240.4" cy="107.4" r="2.4"/><circle cx="268.4" cy="107.4" r="2.4"/><circle cx="275.4" cy="107.4" r="2.4"/></svg>
    </div>
    <!-- Round liquid-glass icons. Each keeps its words for screen readers and as a tooltip. -->
    <div class="status-icons">
      <div id="arduino-status" class="icon-bubble" role="status" data-state="off" title="Remote: not connected">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3.5"/><circle cx="10" cy="7.5" r="1.3" class="fill"/><circle cx="14" cy="7.5" r="1.3" class="fill"/><circle cx="10" cy="12" r="1.3" class="fill"/><circle cx="14" cy="12" r="1.3" class="fill"/><circle cx="10" cy="16.5" r="1.3" class="fill"/><circle cx="14" cy="16.5" r="1.3" class="fill"/></svg>
        <span class="sr-only">Remote: not connected</span>
      </div>
      <div id="camera-permission" class="icon-bubble" data-state="off" title="Camera: not allowed yet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5a2 2 0 0 1 2-2h2l1.6-2h5.8l1.6 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <span class="sr-only">Camera: not allowed yet</span>
      </div>
      <button type="button" id="contrast-toggle" class="icon-bubble" aria-pressed="false" aria-label="High contrast" title="High contrast">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" class="fill"/></svg>
      </button>
    </div>
  </header>

  <!-- Text screen: for sighted helpers (Escape from the camera) -->
  <main id="input-screen" hidden>
    <form id="text-form" class="glass panel">
      <h1>What should we learn?</h1>
      <label for="text-input">Type a word or a few letters</label>
      <textarea id="text-input" rows="2" autocomplete="off" spellcheck="false">abc</textarea>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="start-buttons">
        <button type="submit" id="learn-button" class="glass-button primary" data-mode="learn" aria-label="Learn: type each letter in braille"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span class="label">Learn</span></button>
        <button type="submit" id="read-button" class="glass-button" data-mode="read" aria-label="Read: show each character in braille"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5c-1.8-1.3-4.5-2-8-2v13c3.5 0 6.2.7 8 2 1.8-1.3 4.5-2 8-2v-13c-3.5 0-6.2.7-8 2z"/><path d="M12 6.5v13"/></svg><span class="label">Read</span></button>
        <button type="submit" id="type-button" class="glass-button" data-mode="type" aria-label="Type: write freely with the remote"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg><span class="label">Type</span></button>
        <button type="submit" id="snap-button" class="glass-button" data-mode="snap" aria-label="Camera: learn the name of something you hold up"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5a2 2 0 0 1 2-2h2l1.6-2h5.8l1.6 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg><span class="label">Camera</span></button>
      </div>
    </form>
  </main>

  <!-- Home: hold up an object (automatic), or press Enter and say what to learn -->
  <main id="camera-screen" hidden>
    <div class="camera-frame glass">
      <video id="camera" class="camera" autoplay playsinline muted aria-label="Camera view"></video>
    </div>
    <p id="camera-status" class="camera-status" role="status"></p>
    <div class="controls">
      <button type="button" id="talk-button" class="glass-button primary" aria-label="Talk: say what you want to learn (Enter)"><span class="label">Talk</span><kbd>enter</kbd></button>
      <button type="button" id="shutter-button" class="glass-button" aria-label="Look now: take the photo"><span class="label">Look now</span></button>
      <button type="button" id="camera-back-button" class="glass-button" aria-label="Type text instead (Escape)"><span class="label">Type text</span><kbd>esc</kbd></button>
    </div>
  </main>

  <!-- Lesson: one character at a time (Learn, Read and Type modes).
       Elements with data-show only appear in the listed modes. -->
  <main id="reader-screen" hidden>
    <div class="stage">
      <button type="button" id="prev-button" class="side-button icon-bubble big" data-show="learn read" aria-label="Previous (Left arrow)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>

      <div class="center">
        <div class="flower" aria-hidden="true"></div>
        <div id="char" class="char" role="img" aria-label=""></div>

        <div class="grids glass">
          <figure class="grid-block" data-show="learn read">
            <div id="cell" class="cell" role="img" aria-label="">
              <!-- Grid order is row by row: 1 4 / 2 5 / 3 6 -->
              <span class="dot" data-dot="1"></span><span class="dot" data-dot="4"></span>
              <span class="dot" data-dot="2"></span><span class="dot" data-dot="5"></span>
              <span class="dot" data-dot="3"></span><span class="dot" data-dot="6"></span>
            </div>
            <figcaption data-show="learn">Target</figcaption>
          </figure>

          <figure class="grid-block" data-show="learn type">
            <div id="input-cell" class="cell" role="group" aria-label="Your input">
              <button type="button" class="dot dot-button" data-dot="1" aria-pressed="false" aria-label="1, top left (key 1 or F)"></button>
              <button type="button" class="dot dot-button" data-dot="4" aria-pressed="false" aria-label="4, top right (key 4 or J)"></button>
              <button type="button" class="dot dot-button" data-dot="2" aria-pressed="false" aria-label="2, middle left (key 2 or D)"></button>
              <button type="button" class="dot dot-button" data-dot="5" aria-pressed="false" aria-label="5, middle right (key 5 or K)"></button>
              <button type="button" class="dot dot-button" data-dot="3" aria-pressed="false" aria-label="3, bottom left (key 3 or S)"></button>
              <button type="button" class="dot dot-button" data-dot="6" aria-pressed="false" aria-label="6, bottom right (key 6 or L)"></button>
            </div>
            <figcaption>You</figcaption>
          </figure>
          <div class="badges" data-show="type">
            <span id="capital-badge" class="badge">Capital</span>
            <span id="number-badge" class="badge">Number</span>
          </div>
        </div>

        <p id="position" class="position" data-show="learn read"></p>
        <p id="feedback" class="feedback" data-show="learn type"></p>
        <p id="typed-text" class="typed-text glass" data-show="type" aria-label="Typed text"></p>
      </div>

      <button type="button" id="next-button" class="side-button icon-bubble big" data-show="learn read" aria-label="Next (Right arrow)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="controls">
      <button type="button" id="check-button" class="glass-button primary" data-show="learn" aria-label="Check my answer (Enter)"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg><span class="label">Check</span><kbd>Enter</kbd></button>
      <button type="button" id="enter-button" class="glass-button primary" data-show="type" aria-label="Type this cell (Enter)"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5"/><path d="M9 11l-4 4 4 4"/></svg><span class="label">Enter</span></button>
      <button type="button" id="backspace-button" class="glass-button" data-show="type" aria-label="Delete last character (Backspace)"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg><span class="label">Delete</span></button>
      <button type="button" id="clear-button" class="glass-button" data-show="type" aria-label="Clear all typed text"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/></svg><span class="label">Clear</span></button>
      <button type="button" id="repeat-button" class="glass-button" aria-label="Repeat (R)"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 3.5v5h5"/></svg><span class="label">Repeat</span><kbd>R</kbd></button>
      <button type="button" id="back-button" class="glass-button" aria-label="Done (Escape)"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="label">Done</span><kbd>Esc</kbd></button>
    </div>
